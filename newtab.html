<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>ちょすたぶ・ねお</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="css/newtab.css">
  <script src="js/shared.js" defer></script>
  <script src="js/search.js" defer></script>
  <script src="js/newtab.js" defer></script>
</head>
<body>
  <div id="background" aria-hidden="true"></div>
  <header>
    <form id="searchForm" role="search" action="https://www.google.com/search" method="get">
      <label class="sr-only" for="searchInput">検索キーワードまたはURL</label>
      <input id="searchInput" class="widget" name="q" type="text" placeholder="Search or input URL..." autocomplete="off" spellcheck="false" maxlength="2048" required aria-autocomplete="list" aria-controls="suggestions" aria-expanded="false">
    </form>
  </header>
  <main>
    <div id="suggestions" role="listbox" aria-label="検索候補"></div>
    <nav id="shortcuts" aria-label="ショートカット"></nav>
    <div class="widget" id="date"></div>
    <div class="widget clock-widget"><div id="clock" role="timer" aria-live="off"><span id="hoursMinutes">00:00</span>:<span id="seconds">00</span></div></div>
    <p id="pageStatus" role="status"></p>
  </main>
  <dialog id="shortcutDialog" aria-labelledby="dialogTitle">
    <form id="shortcutForm">
      <div class="dialog-heading"><h1 id="dialogTitle">ショートカットを追加</h1><button id="closeDialog" class="icon-button" type="button" aria-label="閉じる">×</button></div>
      <label for="shortcutName">名前</label>
      <input id="shortcutName" type="text" maxlength="30" placeholder="例：YouTube" required autocomplete="off">
      <label for="shortcutUrl">URL</label>
      <input id="shortcutUrl" type="text" inputmode="url" maxlength="2048" placeholder="https://example.com" required autocomplete="off" autocapitalize="off" spellcheck="false">
      <p id="shortcutError" class="error" role="alert"></p>
      <div class="dialog-actions"><button id="deleteShortcut" class="delete-button" type="button" hidden>削除</button><span></span><button id="cancelDialog" class="secondary-button" type="button">キャンセル</button><button id="saveShortcut" class="primary-button" type="submit">保存</button></div>
    </form>
  </dialog>
</body>
</html>
